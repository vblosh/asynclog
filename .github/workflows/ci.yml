name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release]
        sanitizer: [none, asan, tsan]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtest-dev liblog4cplus-dev cmake build-essential
    
    - name: Configure CMake
      env:
        SANITIZER: ${{ matrix.sanitizer }}
      run: |
        if [ "$SANITIZER" = "asan" ]; then
          CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          LINKER_FLAGS="-fsanitize=address,undefined"
        elif [ "$SANITIZER" = "tsan" ]; then
          CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          LINKER_FLAGS="-fsanitize=thread"
        else
          CXX_FLAGS=""
          LINKER_FLAGS=""
        fi
        
        cmake -B ${{github.workspace}}/build \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DCMAKE_CXX_FLAGS="$CXX_FLAGS" \
              -DCMAKE_EXE_LINKER_FLAGS="$LINKER_FLAGS"
    
    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{ matrix.build_type }}
    
    - name: Run tests
      working-directory: ${{github.workspace}}/build
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        TSAN_OPTIONS: halt_on_error=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        ctest --output-on-failure
    
    - name: Run perfcompare
      working-directory: ${{github.workspace}}/build
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        TSAN_OPTIONS: halt_on_error=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        ./perfcompare/perfcompare
